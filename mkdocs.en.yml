site_name: Blockchain Engineering
site_description: A rigorous, practical guide to blockchain systems, Bitcoin, Ethereum, smart contracts, security, and infrastructure.
site_url: https://guilhermealbert.github.io/blockchain-engineering/
repo_url: https://github.com/guilhermealbert/blockchain-engineering
repo_name: guilhermealbert/blockchain-engineering
edit_uri: edit/main/
docs_dir: .mkdocs-stage/en
site_dir: site
strict: true
use_directory_urls: true

theme:
  name: material
  language: en
  icon:
    logo: material/cube-outline
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Follow system preference

plugins:
  - search:
      lang: en
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: Português do Brasil
      link: /pt-BR/
      lang: pt-BR
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/guilhermealbert/blockchain-engineering

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/language-switcher.js

copyright: Copyright &copy; 2026 Guilherme Albert &middot; MIT License
